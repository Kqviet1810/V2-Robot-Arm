; PlatformIO Project Configuration File for V2 Robot Arm
; =======================================================

[platformio]
default_envs = esp32_main

; -------------------------------------------------------
; 1. MAIN CONTROLLER (ESP32 Dev Module)
; -------------------------------------------------------
[env:esp32_main]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = 
    +<main_mcu/**>
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    gin66/FastAccelStepper @ ^0.31.3
    madhephaestus/ESP32Servo @ ^3.0.6
    bblanchon/ArduinoJson @ ^6.21.4
    links2004/WebSockets @ ^2.4.1

; -------------------------------------------------------
; 2. SENSOR SUB-MCU (ESP32-C3 Super Mini)
; -------------------------------------------------------
[env:esp32_c3_sensor]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = 
    +<c3_sensor/**>
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
